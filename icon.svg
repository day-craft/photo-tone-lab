<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="18 Pro Lab">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1712"/>
      <stop offset="0.55" stop-color="#121010"/>
      <stop offset="1" stop-color="#0a0908"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.18" r="0.72">
      <stop offset="0" stop-color="#f2b878" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#f2b878" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#f2b878" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0.15" y1="0.1" x2="0.9" y2="0.95">
      <stop offset="0" stop-color="#ffe4c2"/>
      <stop offset="0.5" stop-color="#f2b878"/>
      <stop offset="1" stop-color="#c9803c"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#glow)"/>

  <!-- aperture ring -->
  <circle cx="256" cy="256" r="132" fill="none" stroke="url(#ring)" stroke-width="15" opacity="0.95"/>
  <circle cx="256" cy="256" r="86" fill="none" stroke="url(#ring)" stroke-width="6" opacity="0.5"/>

  <!-- diaphragm blades -->
  <g stroke="url(#ring)" stroke-width="13" stroke-linecap="round" opacity="0.92">
    <path d="M256 124 L256 170"/>
    <path d="M370 322 L330 299"/>
    <path d="M142 322 L182 299"/>
  </g>
  <g stroke="url(#ring)" stroke-width="9" stroke-linecap="round" opacity="0.45">
    <path d="M330 190 L370 167"/>
    <path d="M182 190 L142 167"/>
    <path d="M256 388 L256 342"/>
  </g>

  <!-- core -->
  <circle cx="256" cy="256" r="34" fill="url(#ring)"/>
  <circle cx="256" cy="256" r="34" fill="#1a1410" opacity="0.18"/>
  <circle cx="256" cy="256" r="15" fill="#fff6e8" opacity="0.92"/>

  <!-- before / after seam -->
  <line x1="256" y1="196" x2="256" y2="316" stroke="#0d0c0b" stroke-width="4" opacity="0.35"/>
</svg>
